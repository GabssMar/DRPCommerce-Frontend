# Front do DRPCommerce atrás do Gateway (YARP), que termina o TLS de www.drpcommerce.com.br
# e encaminha para cá tudo o que não é /api/store, /api/drop ou /health.
#
#   /                      plataforma: apresentação, planos e painel (#/admin)
#   /nome-da-loja/         loja do cliente (o front lê o slug do primeiro segmento)
#   /nome-da-loja/pagamento?orderId=N   retorno do Mercado Pago
#   /admin/integracoes?…   retornos do painel (OAuth, assinatura)
#
# Todos esses caminhos são a mesma página (index.html); o roteamento é feito no navegador.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    absolute_redirect off;

    # Sem a barra www o cookie __Host- da sessão ficaria num host diferente: um só endereço.
    # O Gateway envia o host público em X-Forwarded-Host.
    if ($http_x_forwarded_host = "drpcommerce.com.br") {
        return 301 https://www.drpcommerce.com.br$request_uri;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Saúde do container (HEALTHCHECK do Dockerfile e do compose).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Arquivos com hash no nome: cache longo. Sem "always": um 404 (arquivo de outra
    # publicação) não pode ficar um ano em cache.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # /api nunca deveria chegar aqui (o Gateway encaminha antes): responde 404 em vez do app.
    location /api/ {
        return 404;
    }

    # Qualquer outro caminho é o app. O index.html nunca fica em cache, para cada
    # publicação chegar na hora.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri /index.html;
    }
}
